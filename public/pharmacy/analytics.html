<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — PillPoint</title>
<link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
(async function () {
  const user = await guardPage(['pharmacy_staff'], 'Analytics', 'Reservation trends for your pharmacy');
  if (!user) return;
  const content = document.getElementById('page-content');
  content.innerHTML = skeletonLoader('cards', 4);
  try {
    const data = await Api.get('/api/pharmacy/analytics');
    const counts = {};
    data.byStatus.forEach(s => counts[s.status] = s.count);
    const deployedCounts = {};
    data.deployedVsNot.forEach(d => deployedCounts[d.deployed] = d.count);
    const reservationDays = new Map(data.dailyReservations.map(row => [row.day, row.count]));
    const recentDays = Array.from({ length: 14 }, (_, index) => {
      const day = new Date();
      day.setDate(day.getDate() - (13 - index));
      const key = `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, '0')}-${String(day.getDate()).padStart(2, '0')}`;
      return { key, label: day.toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' }), count: reservationDays.get(key) || 0 };
    });

    function lineChart(labels, values, unit, color) {
      if (!values.length) return '<div class="empty-state"><p class="text-sm">No data for this period.</p></div>';
      const width = 640, height = 230, left = 48, right = 18, top = 18, bottom = 42;
      const max = Math.max(1, ...values);
      const points = values.map((value, index) => ({
        x: left + (values.length === 1 ? (width - left - right) / 2 : index * (width - left - right) / (values.length - 1)),
        y: top + (height - top - bottom) * (1 - value / max), value,
      }));
      const path = points.map((point, index) => `${index ? 'L' : 'M'}${point.x},${point.y}`).join(' ');
      const step = max / 4;
      return `<div class="analytics-chart-wrap"><svg class="analytics-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Line chart, ${unit} over time">
        ${[0, 1, 2, 3, 4].map(tick => { const y = top + (height - top - bottom) * tick / 4; return `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" class="chart-gridline"/><text x="${left - 8}" y="${y + 4}" text-anchor="end" class="chart-axis-label">${Math.round(max - step * tick)}</text>`; }).join('')}
        <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        ${points.map((point, index) => `<circle cx="${point.x}" cy="${point.y}" r="4" fill="${color}"><title>${labels[index]}: ${unit === 'PHP' ? money(point.value) : `${point.value} ${unit}`}</title></circle><text x="${point.x}" y="${height - 12}" text-anchor="middle" class="chart-axis-label">${escapeHtml(labels[index])}</text>`).join('')}
        <text x="8" y="14" class="chart-axis-label">${unit}</text></svg></div>`;
    }

    function columnChart(labels, values, unit, color) {
      if (!values.length) return '<div class="empty-state"><p class="text-sm">No data for this period.</p></div>';
      const width = 640, height = 230, left = 42, right = 14, top = 18, bottom = 42;
      const max = Math.max(1, ...values);
      const slot = (width - left - right) / values.length;
      return `<div class="analytics-chart-wrap"><svg class="analytics-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Bar chart, ${unit} by weekday">
        ${[0, 1, 2, 3, 4].map(tick => { const y = top + (height - top - bottom) * tick / 4; return `<line x1="${left}" y1="${y}" x2="${width - right}" y2="${y}" class="chart-gridline"/><text x="${left - 8}" y="${y + 4}" text-anchor="end" class="chart-axis-label">${Math.round(max * (4 - tick) / 4)}</text>`; }).join('')}
        ${values.map((value, index) => { const barHeight = (height - top - bottom) * value / max; const x = left + slot * index + slot * .2; return `<rect x="${x}" y="${height - bottom - barHeight}" width="${slot * .6}" height="${barHeight}" rx="3" fill="${color}"><title>${labels[index]}: ${value} ${unit}</title></rect><text x="${left + slot * (index + .5)}" y="${height - 12}" text-anchor="middle" class="chart-axis-label">${escapeHtml(labels[index])}</text>`; }).join('')}
        <text x="8" y="14" class="chart-axis-label">${unit}</text></svg></div>`;
    }

    function horizontalBarChart(rows, labelKey, valueKey, unit, color) {
      if (!rows.length) return '<div class="empty-state"><p class="text-sm">No data available.</p></div>';
      const width = 640, rowHeight = 34, left = 180, right = 78, height = Math.max(100, rows.length * rowHeight + 24);
      const max = Math.max(1, ...rows.map(row => row[valueKey] || 0));
      return `<div class="analytics-chart-wrap"><svg class="analytics-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Horizontal bar chart, ${unit} by ${labelKey}">
        ${rows.map((row, index) => { const y = 12 + index * rowHeight; const barWidth = (width - left - right) * (row[valueKey] || 0) / max; return `<text x="${left - 10}" y="${y + 19}" text-anchor="end" class="chart-axis-label">${escapeHtml(row[labelKey])}</text><rect x="${left}" y="${y + 4}" width="${Math.max(1, barWidth)}" height="20" rx="3" fill="${color}"><title>${escapeHtml(row[labelKey])}: ${row[valueKey]} ${unit}</title></rect><text x="${left + barWidth + 8}" y="${y + 19}" class="chart-axis-label">${row[valueKey]}</text>`; }).join('')}
        <text x="${left}" y="${height - 2}" class="chart-axis-label">${unit}</text></svg></div>`;
    }

    content.innerHTML = `
      <div class="grid grid-4">
        <div class="card stat-card"><div class="stat-label">Pending</div><div class="stat-value">${counts.pending || 0}</div></div>
        <div class="card stat-card"><div class="stat-label">Confirmed</div><div class="stat-value">${counts.confirmed || 0}</div></div>
        <div class="card stat-card"><div class="stat-label">Completed</div><div class="stat-value">${counts.completed || 0}</div></div>
        <div class="card stat-card"><div class="stat-label">Cancelled</div><div class="stat-value">${counts.cancelled || 0}</div></div>
      </div>

      <div class="grid mt-24" style="grid-template-columns: 1fr 1fr; gap:18px;">
        <div class="card">
          <div class="card-title">Inventory by Category</div>
          ${data.inventoryByCategory.length
            ? pieChart3D(data.inventoryByCategory.map(c => ({ label: c.category, value: c.count })), { donut: false, shadow: false })
            : `<div class="empty-state" style="padding:24px;"><p class="text-sm">No inventory yet.</p></div>`}
        </div>
        <div class="card">
          <div class="card-title">Deployed vs Not Deployed</div>
          ${pieChartSvg([
            { label: 'Deployed', value: deployedCounts[1] || 0, color: '#14B8A6' },
            { label: 'Not Deployed', value: deployedCounts[0] || 0, color: '#CBD5E1' },
          ], { donut: false })}
        </div>
      </div>

      <div class="section-title">Reservation Statistics <span class="text-sm muted" style="font-weight:400;">(Mon–Sun, last 8 weeks)</span></div>
      <div class="card"><div class="card-title">Reservations by Weekday</div>${columnChart(data.reservationStats.labels, data.reservationStats.counts, 'reservations', '#168f83')}</div>

      <div class="section-title">Customer and Reservation Trends</div>
      <div class="grid grid-2">
        <div class="card"><div class="card-title">Daily Reservations <span class="text-sm muted">(last 14 days)</span></div>${lineChart(recentDays.map(day => day.label), recentDays.map(day => day.count), 'reservations', '#367e9b')}</div>
        <div class="card"><div class="card-title">Completed vs. Cancelled</div>${columnChart(['Completed', 'Cancelled'], [counts.completed || 0, counts.cancelled || 0], 'reservations', '#d08932')}</div>
      </div>

      <div class="section-title">Revenue Trend <span class="text-sm muted" style="font-weight:400;">(completed reservations, last 6 months)</span></div>
      <div class="card">
        <div class="card-title">Monthly Revenue</div>
        ${data.monthlyRevenue.length
          ? lineChart(data.monthlyRevenue.map(m => m.ym), data.monthlyRevenue.map(m => m.revenue || 0), 'PHP', '#168f83')
          : `<div class="empty-state"><h3>No completed sales yet</h3><p>Revenue trend appears once reservations are marked picked up.</p></div>`}
      </div>

      <div class="grid grid-2 mt-24">
        <div class="card"><div class="card-title">Medicine Stock Levels <span class="text-sm muted">(units on hand)</span></div>${horizontalBarChart(data.stockLevels, 'medicine_name', 'stock_quantity', 'units', '#d89b19')}</div>
        <div class="card"><div class="card-title">Pharmacy Ratings <span class="text-sm muted">(reviews by star rating)</span></div>${columnChart(data.ratingDistribution.map(r => `${r.rating} star`), data.ratingDistribution.map(r => r.count), 'reviews', '#367e9b')}</div>
        <div class="card"><div class="card-title">Low-Stock Medicines <span class="text-sm muted">(units remaining)</span></div>${horizontalBarChart(data.lowStockMedicines, 'medicine_name', 'stock_quantity', 'units', '#bd554d')}</div>
        <div class="card"><div class="card-title">Most Requested Medicines <span class="text-sm muted">(units reserved)</span></div>${horizontalBarChart(data.topMedicines, 'name', 'total_reserved', 'units', '#168f83')}</div>
      </div>

    `;
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
