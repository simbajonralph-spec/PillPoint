<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — PillPoint</title>
<link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
<link rel="stylesheet" href="/css/style.css?v=20261011-customer-profile-theme" />
<link rel="stylesheet" href="/css/admin-profile-theme.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async function () {
  const user = await guardPage(null, 'Profile', 'Your account information');
  if (!user) return;
  const content = document.getElementById('page-content');

  if (user.role === 'pharmacy_staff') {
    document.body.classList.add('pharmacy-staff-profile-page');
    document.querySelector('.topbar-heading h1').textContent = 'Pharmacy Profile';
    document.querySelector('.topbar-heading .sub').textContent = 'Manage your pharmacy identity and business details';
    await renderPharmacyProfile();
  } else {
    if (user.role === 'customer') document.body.classList.add('customer-profile-page');
    else if (user.role === 'admin') {
      document.body.classList.add('admin-profile-page');
      document.getElementById('app-shell')?.classList.add('admin-profile-shell');
    }
    renderBasicProfile(user);
  }

  function renderBasicProfile(u) {
    let profileImageData = u.profile_image || null;
    const roleLabel = u.role === 'admin' ? 'Administrator' : 'Customer';
    content.innerHTML = `
      <div class="customer-profile-layout">
        <section class="customer-profile-summary">
          <div class="customer-profile-avatar-wrap"><div class="customer-profile-avatar" id="profile-summary-avatar">${profileImageData ? `<img src="${escapeHtml(profileImageData)}" alt="Profile photo" />` : iconSvg('user', 68)}</div><label class="customer-profile-camera" for="profile-image-input" aria-label="Upload profile photo">${iconSvg('camera', 17)}</label></div>
          <h2 id="profile-summary-name">${escapeHtml(u.username || u.name)}</h2><span class="customer-profile-role">${roleLabel}</span><span class="customer-profile-verified">${iconSvg('user', 14)} ${roleLabel} account</span>
          <div class="customer-profile-health"><span class="customer-profile-health-icon">✚</span><div><strong>Your health and safety matter.</strong><p>Keep your profile updated so we can provide you with the best service.</p></div></div>
        </section>
        <div class="customer-profile-main">
          <section class="customer-profile-information">
            <div class="customer-profile-section-heading"><div><h2>Personal information</h2><p>Update your details below.</p></div><div class="customer-profile-photo"><div class="customer-profile-photo-avatar" id="profile-photo-avatar">${profileImageData ? `<img src="${escapeHtml(profileImageData)}" alt="Profile photo" />` : iconSvg('user', 42)}</div><div class="customer-profile-photo-copy"><strong>Profile photo</strong><span>Add a clear photo of yourself for a better experience.</span><div class="customer-profile-photo-actions"><label class="btn btn-primary btn-sm" for="profile-image-input">Upload photo</label><button type="button" class="btn btn-outline btn-sm" id="remove-profile-photo">Remove</button></div></div></div></div>
            <input class="customer-profile-file" id="profile-image-input" type="file" accept="image/png,image/jpeg,image/webp" />
            <div class="customer-profile-fields"><div class="field"><label for="username-input">Full name</label><input id="username-input" value="${escapeHtml(u.username || u.name)}" autocomplete="name" /></div><div class="field"><label for="user-phone-input">Mobile number</label><input id="user-phone-input" type="tel" value="${escapeHtml(u.phone || '')}" placeholder="+639XXXXXXXXX" pattern="\+639[0-9]{9}" autocomplete="tel" /></div><div class="field"><label>Email</label><input value="${escapeHtml(u.email)}" disabled></div><div class="field"><label>Account role</label><input value="${roleLabel}" disabled></div></div>
            <p class="customer-profile-admin-note">${iconSvg('activity', 16)} Email and role are managed by the administrator and cannot be changed here.</p><div class="customer-profile-actions"><button class="btn btn-primary" id="save-btn">${iconSvg('check', 16)} Save changes</button><button class="btn btn-outline" id="cancel-btn" type="button">Cancel</button></div>
          </section>
          <section class="customer-profile-security"><div class="customer-profile-security-icon">${iconSvg('shield', 21)}</div><div><h3>Account security</h3><p>Keep your account safe and secure.</p></div></section>
        </div>
      </div>
    `;
    const originalProfile = { username: u.username || u.name || '', phone: u.phone || '', image: profileImageData };
    const updatePhoto = image => {
      document.getElementById('profile-summary-avatar').innerHTML = image ? `<img src="${escapeHtml(image)}" alt="Profile photo" />` : iconSvg('user', 68);
      document.getElementById('profile-photo-avatar').innerHTML = image ? `<img src="${escapeHtml(image)}" alt="Profile photo" />` : iconSvg('user', 42);
    };
    document.getElementById('profile-image-input').addEventListener('change', () => {
      const file = document.getElementById('profile-image-input').files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) { toast('Please choose an image under 4MB.', 'error'); document.getElementById('profile-image-input').value = ''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        profileImageData = reader.result;
        updatePhoto(profileImageData);
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('save-btn').addEventListener('click', async () => {
      try {
        const res = await Api.put('/api/auth/profile', {
          username: document.getElementById('username-input').value.trim(),
          phone: document.getElementById('user-phone-input').value.trim(),
          profile_image: profileImageData,
        });
        toast('Profile updated.');
        document.getElementById('profile-summary-name').textContent = res.user.username;
        const nameEl = document.querySelector('.user-box .user-name');
        if (nameEl) nameEl.textContent = res.user.username;
        const profileLink = document.querySelector('.topbar-profile-avatar');
        if (profileLink) profileLink.innerHTML = profileImageData ? `<img src="${escapeHtml(profileImageData)}" alt="" />` : iconSvg('user', 20);
      } catch (err) {
        toast(err.message, 'error');
      }
    });
    document.getElementById('remove-profile-photo').addEventListener('click', () => {
      profileImageData = null;
      document.getElementById('profile-image-input').value = '';
      updatePhoto(null);
    });
    document.getElementById('cancel-btn').addEventListener('click', () => {
      document.getElementById('username-input').value = originalProfile.username;
      document.getElementById('profile-summary-name').textContent = originalProfile.username;
      document.getElementById('user-phone-input').value = originalProfile.phone;
      profileImageData = originalProfile.image;
      document.getElementById('profile-image-input').value = '';
      updatePhoto(profileImageData);
    });
  }

  async function renderPharmacyProfile() {
    content.innerHTML = skeletonLoader('cards', 2);
    let data;
    try {
      data = await Api.get('/api/pharmacy/profile');
    } catch (err) {
      content.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      return;
    }
    const p = data.pharmacy;
    const verificationStatus = p.verification_stage || (p.verification_status === 'VERIFIED' ? 'APPROVED' : p.verification_status || 'PENDING');
    const statusLabels = {
      PENDING: 'Pending verification',
      UNDER_REVIEW: 'Under review',
      CORRECTION_REQUIRED: 'Correction required',
      APPROVED: 'Approved',
      REJECTED: 'Rejected',
      SUSPENDED: 'Suspended',
      REVERIFICATION_REQUIRED: 'Reverification required',
    };
    let businessPermitData = null;
    let permitRead = Promise.resolve();
    let pickedLat = p.latitude, pickedLng = p.longitude;
    let profileImageData = p.profile_image || p.store_image || null;
    let coverImageData = p.cover_image || null;
    const avatarFallback = () => `<span class="pharmacy-avatar-name">${escapeHtml(p.name)}</span>`;
    const coverFallback = () => '<div class="pharmacy-cover-fallback" aria-hidden="true"></div>';
    const averageRating = data.reviews.length
      ? (data.reviews.reduce((total, review) => total + review.rating, 0) / data.reviews.length).toFixed(1)
      : '—';

    const ratingCounts = data.ratingDistribution || [5, 4, 3, 2, 1].map(rating => ({ rating, count: data.reviews.filter(review => review.rating === rating).length }));
    const stars = rating => `${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}`;
    const infoRow = (icon, label, value) => `<div class="pharmacy-info-row"><span class="pharmacy-info-icon">${icon}</span><span class="pharmacy-info-label">${label}</span><span class="pharmacy-info-value">${value || 'Not provided'}</span></div>`;
    const mapUrl = `https://www.openstreetmap.org/?mlat=${encodeURIComponent(p.latitude)}&mlon=${encodeURIComponent(p.longitude)}#map=16/${encodeURIComponent(p.latitude)}/${encodeURIComponent(p.longitude)}`;
    content.innerHTML = `
      <div class="pharmacy-profile-page">
        <section class="pharmacy-profile-hero">
          <div class="pharmacy-profile-cover" id="cover-preview">${coverImageData ? `<img src="${escapeHtml(coverImageData)}" alt="Pharmacy cover" />` : coverFallback()}</div>
          <div class="pharmacy-profile-hero-content">
            <div class="pharmacy-avatar-preview" id="profile-preview">${profileImageData ? `<img src="${escapeHtml(profileImageData)}" alt="${escapeHtml(p.name)} logo" />` : avatarFallback()}</div>
            <div class="pharmacy-profile-headline">
              <span class="pharmacy-status-chip ${verificationStatus === 'APPROVED' ? 'is-approved' : ''}">${escapeHtml(statusLabels[verificationStatus] || verificationStatus)}</span>
              <h2 id="pharmacy-profile-name">${escapeHtml(p.name)}</h2>
            </div>
            <div class="pharmacy-profile-actions"><button class="btn btn-outline" id="edit-profile-trigger" type="button">Edit Profile</button><a class="btn btn-outline" href="${mapUrl}" target="_blank" rel="noopener">View on Map</a></div>
          </div>
        </section>
        ${['CORRECTION_REQUIRED', 'REVERIFICATION_REQUIRED'].includes(verificationStatus) ? `
          <section class="alert alert-warning mt-16" role="status"><strong>${statusLabels[verificationStatus]}</strong><p class="mt-8">${escapeHtml(p.correction_reason || p.verification_reason || 'Update your pharmacy information and documents before resubmitting.')}</p><button type="button" class="btn btn-primary btn-sm mt-12" id="resubmit-verification">Submit for Review</button></section>` : ''}
        <div class="pharmacy-profile-grid" id="profile-overview">
          <div class="pharmacy-profile-column">
            <section class="pharmacy-profile-card pharmacy-info-card">
              <div class="pharmacy-section-heading"><span class="pharmacy-heading-icon">▣</span><div><h3>Pharmacy Information</h3><p>Basic details about your pharmacy</p></div></div>
              <div class="pharmacy-info-list">
                ${infoRow('▣', 'Pharmacy Name', escapeHtml(p.name))}
                ${infoRow('◇', 'Business Type', escapeHtml(p.business_type || 'Pharmacy'))}
                ${infoRow('⬡', 'License Number', escapeHtml(p.license_number || 'Not provided'))}
                ${infoRow('♙', 'Owner / Manager', escapeHtml([p.owner_first_name, p.owner_last_name].filter(Boolean).join(' ')))}
                ${infoRow('✉', 'Email Address', escapeHtml(p.business_email || ''))}
                ${p.description ? infoRow('▤', 'Description', escapeHtml(p.description)) : ''}
              </div>
            </section>
            <section class="pharmacy-profile-card pharmacy-license-card" id="profile-licenses">
              <div class="pharmacy-section-heading"><span class="pharmacy-heading-icon">⬡</span><div><h3>Accreditation &amp; Licenses</h3><p>Verification and compliance</p></div></div>
              <div class="pharmacy-license-chips"><span>${p.has_business_permit ? '✓ Business permit on file' : '• Business permit not uploaded'}</span><span>${verificationStatus === 'APPROVED' ? '✓ Pharmacy verified' : '• Verification pending'}</span></div>
              <button class="btn btn-outline btn-sm" type="button" data-open-edit>Manage documents</button>
            </section>
          </div>
          <div class="pharmacy-profile-column">
            <section class="pharmacy-profile-card" id="profile-contact">
              <div class="pharmacy-section-heading"><span class="pharmacy-heading-icon">▣</span><div><h3>Contact Information</h3><p>Get in touch with us</p></div></div>
              <div class="pharmacy-contact-list">
                <div><span>☎</span><span>${escapeHtml(p.phone || 'Phone not provided')}</span>${p.phone ? `<a href="tel:${escapeHtml(p.phone)}">Call</a>` : ''}</div>
                <div><span>✉</span><span>${escapeHtml(p.business_email || 'Email not provided')}</span>${p.business_email ? `<a href="mailto:${escapeHtml(p.business_email)}">Email</a>` : ''}</div>
              </div>
            </section>
            <section class="pharmacy-profile-card pharmacy-hours-card" id="profile-hours">
              <div class="pharmacy-section-heading"><span class="pharmacy-heading-icon">◷</span><div><h3>Business Hours</h3><p>Hours of operation</p></div></div>
              <p class="pharmacy-hours-value">${escapeHtml(p.hours || 'Business hours have not been added yet.')}</p>
            </section>
            <section class="pharmacy-profile-card pharmacy-map-card">
              <div class="pharmacy-section-heading"><span class="pharmacy-heading-icon">⌖</span><div><h3>Location</h3><p>Find your pharmacy on the map</p></div></div>
              <div class="pharmacy-map-preview" id="profile-map"></div>
              <div class="pharmacy-map-footer"><p class="pharmacy-map-address">⌖ <span>${escapeHtml(p.address || 'Address not provided')}</span></p><a href="${mapUrl}" target="_blank" rel="noopener">Directions</a></div>
            </section>
          </div>
          <div class="pharmacy-profile-column">
            <section class="pharmacy-profile-card pharmacy-reviews-card" id="profile-reviews">
              <div class="pharmacy-section-heading"><span class="pharmacy-heading-icon">★</span><div><h3>Ratings &amp; Reviews</h3><p>What customers say</p></div></div>
              <div class="pharmacy-rating-summary"><strong>${averageRating}</strong><div><span class="pharmacy-hero-stars">${stars(Math.round(Number(averageRating) || 0))}</span><small>${data.reviews.length} reviews</small></div></div>
              <div class="pharmacy-rating-bars">${ratingCounts.slice().sort((a, b) => b.rating - a.rating).map(item => { const percent = data.reviews.length ? Math.round(item.count / data.reviews.length * 100) : 0; return `<div><span>${item.rating} ★</span><span class="pharmacy-rating-track"><i style="width:${percent}%"></i></span><small>${percent}%</small></div>`; }).join('')}</div>
              <a class="pharmacy-text-link" href="#profile-reviews-list">View all reviews →</a>
            </section>
            <section class="pharmacy-profile-card pharmacy-reviews-list" id="profile-reviews-list">
              <div class="pharmacy-section-heading"><span class="pharmacy-heading-icon">✦</span><div><h3>Recent Reviews</h3><p>Customer feedback</p></div></div>
              ${data.reviews.length ? data.reviews.slice(0, 3).map(review => `<article class="pharmacy-review-row"><div class="pharmacy-review-top"><strong>${escapeHtml(review.customer_username || review.customer_name)}</strong><span class="review-stars">${stars(review.rating)}</span></div><small>${new Date(review.updated_at).toLocaleDateString()}</small>${review.comment ? `<p>${escapeHtml(review.comment)}</p>` : ''}</article>`).join('') : '<div class="pharmacy-empty-reviews">No reviews yet</div>'}
            </section>
          </div>
        </div>
        <details class="pharmacy-profile-editor" id="profile-editor">
          <summary>Edit pharmacy profile</summary>
        <section class="pharmacy-edit-section">
          <div class="card-title">Pharmacy Identity</div>
          <div class="field"><label for="pharmacy-name-input">Pharmacy Name</label><input id="pharmacy-name-input" value="${escapeHtml(p.name)}" required /></div>
          <div class="grid grid-2">
            <div class="field">
              <label for="profile-image-input">Pharmacy Profile Photo <span class="muted text-sm">(optional)</span></label>
              <input id="profile-image-input" type="file" accept="image/png,image/jpeg,image/webp" />
              <div class="text-sm muted mt-8">Maximum 4MB.</div>
              <button class="btn btn-outline btn-sm mt-8" type="button" id="clear-profile-image">Remove photo</button>
            </div>
            <div class="field">
              <label for="cover-image-input">Pharmacy Cover Photo <span class="muted text-sm">(optional)</span></label>
              <input id="cover-image-input" type="file" accept="image/png,image/jpeg,image/webp" />
              <div class="text-sm muted mt-8">Maximum 4MB.</div>
              <button class="btn btn-outline btn-sm mt-8" type="button" id="clear-cover-image">Remove photo</button>
            </div>
          </div>
        </section>
        <section class="pharmacy-edit-section">
          <div class="card-title">Owner Information</div>
          <p class="text-sm muted">This information is visible only within your Pharmacy Profile.</p>
          <div class="grid grid-2">
            <div class="field"><label for="owner-first-name-input">Owner First Name</label><input id="owner-first-name-input" value="${escapeHtml(p.owner_first_name || '')}" /></div>
            <div class="field"><label for="owner-last-name-input">Owner Last Name</label><input id="owner-last-name-input" value="${escapeHtml(p.owner_last_name || '')}" /></div>
          </div>
        </section>
        <section class="pharmacy-edit-section">
          <div class="card-title">Business Contact Information</div>
          <div class="grid grid-2">
            <div class="field"><label for="phone-input">Business / Pharmacy Contact Number</label><input id="phone-input" type="tel" value="${escapeHtml(p.phone || '')}" /></div>
            <div class="field"><label for="business-email-input">Business Email</label><input id="business-email-input" type="email" value="${escapeHtml(p.business_email || '')}" /></div>
          </div>
          <div class="field"><label for="address-input">Pharmacy Address</label><input id="address-input" value="${escapeHtml(p.address || '')}" required /></div>
          <div class="field"><label>Description</label><textarea id="description-input" rows="3">${escapeHtml(p.description || '')}</textarea></div>
          <div class="grid grid-2">
            <div class="field"><label>Operating Hours</label><input id="hours-input" value="${escapeHtml(p.hours || '')}" placeholder="e.g. Mon-Sat: 8AM-9PM" /></div>
          </div>
          <div class="field">
            <label for="business-permit-input">Business Permit</label>
            <input id="business-permit-input" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" />
            <div class="text-sm muted mt-8" id="business-permit-status">${p.has_business_permit ? 'A permit is on file. Choose a new file only if replacing it.' : 'No business permit is on file. Upload a PDF, PNG, JPG, or WEBP file (max 4MB).'}</div>
          </div>
          <div class="field">
            <label>Location <span class="muted text-sm">(click the map to update your pin)</span></label>
            <div class="map-placeholder" style="height:220px;"><div id="picker-map"></div></div>
            <p class="text-sm muted mt-8" id="picker-coords">Current: ${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}</p>
          </div>
          <button class="btn btn-primary" id="save-btn">Save Changes</button>
        </section>
        </details>
      </div>
    `;

    const editor = document.getElementById('profile-editor');
    const openEditor = () => { editor.open = true; editor.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    editor.addEventListener('toggle', () => {
      if (editor.open) setTimeout(() => map.invalidateSize(), 80);
    });
    document.getElementById('edit-profile-trigger').addEventListener('click', openEditor);
    document.querySelectorAll('[data-open-edit]').forEach(button => button.addEventListener('click', openEditor));
    if (Number.isFinite(Number(p.latitude)) && Number.isFinite(Number(p.longitude))) {
      const previewMap = L.map('profile-map', { zoomControl: false, scrollWheelZoom: false, dragging: false }).setView([p.latitude, p.longitude], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(previewMap);
      L.marker([p.latitude, p.longitude]).addTo(previewMap);
    } else {
      document.getElementById('profile-map').innerHTML = '<span>Location pin not set</span>';
    }

    function bindImagePreview(inputId, previewId, updateImage, renderFallback) {
      document.getElementById(inputId).addEventListener('change', () => {
        const file = document.getElementById(inputId).files[0];
        if (!file) return;
        if (file.size > 4 * 1024 * 1024) {
          document.getElementById(inputId).value = '';
          toast('Please choose an image under 4MB.', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          updateImage(reader.result);
          const preview = document.getElementById(previewId);
          preview.innerHTML = `<img src="${escapeHtml(reader.result)}" alt="Image preview" />`;
        };
        reader.readAsDataURL(file);
      });
    }
    bindImagePreview('profile-image-input', 'profile-preview', image => { profileImageData = image; }, avatarFallback);
    bindImagePreview('cover-image-input', 'cover-preview', image => { coverImageData = image; }, coverFallback);
    document.getElementById('business-permit-input').addEventListener('change', () => {
      const input = document.getElementById('business-permit-input');
      const file = input.files[0];
      if (!file) return;
      if (file.size > 4 * 1024 * 1024) {
        input.value = '';
        toast('Please choose a business permit under 4MB.', 'error');
        return;
      }
      if (!['application/pdf', 'image/png', 'image/jpeg', 'image/webp'].includes(file.type)) {
        input.value = '';
        toast('Business permit must be a PDF, PNG, JPG, or WEBP file.', 'error');
        return;
      }
      permitRead = new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          businessPermitData = reader.result;
          document.getElementById('business-permit-status').textContent = `Selected: ${file.name}. Save Changes to upload it.`;
          resolve();
        };
        reader.onerror = () => reject(new Error('Could not read the selected business permit. Please choose the file again.'));
        reader.readAsDataURL(file);
      });
    });
    document.getElementById('clear-profile-image').addEventListener('click', () => {
      profileImageData = null;
      document.getElementById('profile-image-input').value = '';
      document.getElementById('profile-preview').innerHTML = avatarFallback();
    });
    document.getElementById('clear-cover-image').addEventListener('click', () => {
      coverImageData = null;
      document.getElementById('cover-image-input').value = '';
      document.getElementById('cover-preview').innerHTML = coverFallback();
    });

    const map = L.map('picker-map').setView([p.latitude, p.longitude], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    let marker = L.marker([p.latitude, p.longitude]).addTo(map);
    setTimeout(() => map.invalidateSize(), 50);

    map.on('click', (e) => {
      pickedLat = e.latlng.lat;
      pickedLng = e.latlng.lng;
      map.removeLayer(marker);
      marker = L.marker([pickedLat, pickedLng]).addTo(map);
      document.getElementById('picker-coords').textContent = `Pin set at ${pickedLat.toFixed(5)}, ${pickedLng.toFixed(5)}`;
    });

    document.getElementById('save-btn').addEventListener('click', async () => {
      try {
        await permitRead;
        const payload = {
          name: document.getElementById('pharmacy-name-input').value.trim(),
          phone: document.getElementById('phone-input').value.trim(),
          business_email: document.getElementById('business-email-input').value.trim(),
          address: document.getElementById('address-input').value.trim(),
          latitude: pickedLat,
          longitude: pickedLng,
          profile_image: profileImageData,
          cover_image: coverImageData,
          description: document.getElementById('description-input').value.trim(),
          hours: document.getElementById('hours-input').value.trim(),
          owner_first_name: document.getElementById('owner-first-name-input').value.trim(),
          owner_last_name: document.getElementById('owner-last-name-input').value.trim(),
        };
        if (businessPermitData !== null) payload.business_permit = businessPermitData;
        const saved = await Api.put('/api/pharmacy/profile', payload);
        businessPermitData = null;
        permitRead = Promise.resolve();
        p.has_business_permit = Boolean(saved.pharmacy.business_permit);
        document.getElementById('business-permit-status').textContent = p.has_business_permit
          ? 'A permit is on file. Choose a new file only if replacing it.'
          : 'No business permit is on file. Upload a PDF, PNG, JPG, or WEBP file (max 4MB).';
        const pharmacyName = document.getElementById('pharmacy-name-input').value.trim();
        p.name = pharmacyName;
        p.profile_image = saved.pharmacy.profile_image;
        p.cover_image = saved.pharmacy.cover_image;
        document.getElementById('pharmacy-profile-name').textContent = pharmacyName;
        document.querySelectorAll('.pharmacy-avatar-name').forEach(el => { el.textContent = pharmacyName; });
        document.querySelectorAll('.pharmacy-cover-fallback strong').forEach(el => { el.textContent = pharmacyName; });
        const topbarProfile = document.getElementById('topbar-pharmacy-profile');
        if (topbarProfile) {
          const label = topbarProfile.querySelector('.topbar-user-name');
          if (label) label.textContent = pharmacyName;
          const avatar = topbarProfile.querySelector('.topbar-profile-avatar');
          if (avatar) avatar.innerHTML = p.profile_image
            ? `<img src="${escapeHtml(p.profile_image)}" alt="" />`
            : '<span aria-hidden="true">Rx</span>';
          topbarProfile.setAttribute('aria-label', `Open ${pharmacyName} Pharmacy Profile`);
        }
        const sidebarName = document.querySelector('.sidebar .user-name');
        if (sidebarName) sidebarName.textContent = pharmacyName;
        toast('Profile updated.');
      } catch (err) {
        toast(err.message, 'error');
      }
    });

    const resubmitButton = document.getElementById('resubmit-verification');
    if (resubmitButton) resubmitButton.addEventListener('click', async () => {
      try {
        await Api.post('/api/pharmacy/verification/resubmit', {});
        toast('Registration submitted for review.');
        await renderPharmacyProfile();
      } catch (err) {
        toast(err.message, 'error');
      }
    });
  }
})();
</script>
</body>
</html>
